[project]
name = "krudo"
version = "0.1.0"
description = "NCR Pump Price Tracker: medallion pipeline turning DOE's weekly Metro Manila retail pump price PDFs into open data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "pdfplumber>=0.11",
    "pyarrow>=17",
]

[project.scripts]
krudo = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "ingestion", "pipeline", "warehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 bans print(): pipeline code must use logging

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
