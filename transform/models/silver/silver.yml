version: 2

models:
  - name: stg_doe_prices
    description: >-
      DOE price cells, one per bronze row, newest download of each report only. Prices are
      numbers or NULL (never 0); range cells are split into price_low and price_high.
    columns:
      - name: week_start
        data_tests: [not_null]
      - name: product
        data_tests: [not_null]
      - name: measure
        data_tests:
          - accepted_values:
              arguments:
                values: [brand, overall, common]
      - name: brand
        data_tests:
          - not_null:
              config:
                where: measure = 'brand'
      - name: city
        data_tests:
          - not_null:
              config:
                where: geo_level = 'city'

unit_tests:
  - name: test_parse_every_raw_value_shape
    description: One row per kind of raw value in the lake (2026-11-12 survey).
    model: stg_doe_prices
    given:
      - input: source('bronze', 'manifest')
        rows: []
      - input: ref('cities')
        rows: []
      - input: ref('brands')
        rows: []
      - input: ref('products')
        rows: []
      - input: source('bronze', 'doe_prices')
        format: csv
        rows: |
          era,report_date,cell_kind,value_raw,source_file
          B,2024-01-01,brand_low,53.38,a1
          B,2024-01-02,brand_high,100.00,a2
          B,2024-01-03,brand_low,54.3,a3
          B,2024-01-04,brand_low,3700,a4
